name: OmniRoute Adapter Validation

on:
  push:
    branches:
      - feature/omniroute-video-adapter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniroute-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false
  NODE_OPTIONS: --max-old-space-size=4096
  MONOREPO_DIR: project/aitoearn-backend

jobs:
  validate-omniroute:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ env.MONOREPO_DIR }}/pnpm-lock.yaml

      - name: Install affected workspace dependencies
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter aitoearn-ai...

      - name: Type-check aitoearn-ai
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm exec tsc -p apps/aitoearn-ai/tsconfig.app.json --noEmit

      - name: Lint aitoearn-ai
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm nx lint aitoearn-ai --fix=false --outputStyle=static

      - name: Run OmniRoute and affected video-service tests
        working-directory: ${{ env.MONOREPO_DIR }}
        run: >-
          pnpm exec vitest --config apps/aitoearn-ai/vitest.config.mts run
          apps/aitoearn-ai/src/core/ai/libs/omniroute/omniroute.service.spec.ts
          apps/aitoearn-ai/src/core/ai/video/omniroute/omniroute-video.service.spec.ts
          apps/aitoearn-ai/src/core/ai/video/video.omniroute.spec.ts
          apps/aitoearn-ai/src/core/ai/video/video.service.spec.ts

      - name: Build aitoearn-ai
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm nx build aitoearn-ai --outputStyle=static
