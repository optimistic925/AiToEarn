name: OmniRoute Duration Semantics Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: omniroute-duration-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-web:
    name: Focused Web Typecheck, Lint, Duration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      WEB_DIR: project/aitoearn-web

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ env.WEB_DIR }}/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check web
        working-directory: ${{ env.WEB_DIR }}
        run: |
          cat > next-env.d.ts <<'EOF'
          /// <reference types="next" />
          /// <reference types="next/image-types/global" />
          EOF
          pnpm type-check

      - name: Lint affected web files
        working-directory: ${{ env.WEB_DIR }}
        run: >-
          pnpm exec eslint --no-fix
          src/types/video-duration-control.d.ts
          src/components/draft-box/components/AiBatchGenerateBar/utils/durationControl.ts
          src/components/draft-box/components/AiBatchGenerateBar/hooks/useAiBatchSubmitHandler.ts
          src/components/draft-box/components/AiBatchGenerateBar/hooks/useAiBatchGenerateBarController.ts
          src/components/draft-box/components/AiBatchGenerateBar/components/ToolBarInline/index.tsx
          src/components/draft-box/components/AiBatchGenerateBar/components/ToolBarInline/components/VideoModelParamsSelect/index.tsx
          tests/omniroute-duration-semantics.spec.ts
          tests/omniroute-duration-production-path.spec.ts
          tests/omniroute-duration-toolbar-render.spec.ts
          tests/toolbar-app/app/layout.tsx
          tests/toolbar-app/app/page.tsx

      - name: Run helper and production submission tests
        working-directory: ${{ env.WEB_DIR }}
        run: >-
          NODE_OPTIONS="$NODE_OPTIONS --require ./tests/register-playwright-assets.cjs"
          pnpm exec playwright test
          tests/omniroute-duration-semantics.spec.ts
          tests/omniroute-duration-production-path.spec.ts
          --workers=1

      - name: Install Chromium for toolbar browser proof
        working-directory: ${{ env.WEB_DIR }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real toolbar browser rendering tests
        working-directory: ${{ env.WEB_DIR }}
        run: |
          pnpm exec next dev tests/toolbar-app --hostname 127.0.0.1 --port 3101 > /tmp/toolbar-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3101/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3101/ > /dev/null || { cat /tmp/toolbar-next.log; exit 1; }
          pnpm exec playwright test tests/omniroute-duration-toolbar-render.spec.ts --workers=1
