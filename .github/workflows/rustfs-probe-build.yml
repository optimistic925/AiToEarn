name: Build RustFS Probe Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/optimistic925/aitoearn-rustfs-probe
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source SHA
        run: |
          set -eu
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "${GITHUB_SHA}"
          echo "source_sha=$ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tag
        id: meta
        run: |
          set -eu
          DATE_TAG="$(date -u +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          TAG="${DATE_TAG}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push probe image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/rustfs-probe
          file: tools/rustfs-probe/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Report digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
