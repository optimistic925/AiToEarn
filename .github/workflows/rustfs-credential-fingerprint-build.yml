name: Build RustFS Credential Fingerprint Image

on:
  push:
    branches:
      - diag/rustfs-credential-fingerprint-20260821
    paths:
      - 'tools/rustfs-credential-fingerprint/**'
      - '.github/workflows/rustfs-credential-fingerprint-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/optimistic925/aitoearn-rustfs-credential-fingerprint
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/rustfs-credential-fingerprint
          file: tools/rustfs-credential-fingerprint/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Report immutable reference
        run: |
          echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE=${IMAGE}:${GITHUB_SHA}"
          echo "DIGEST=${{ steps.build.outputs.digest }}"
